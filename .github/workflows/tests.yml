name: Testes Automatizados e Cobertura (Pytest)

on:
  push:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Executar Pytest com Coverage
        env:
          DJANGO_SETTINGS_MODULE: gestao_acub.settings
        run: pytest -v --cov=core --cov-report=term-missing
